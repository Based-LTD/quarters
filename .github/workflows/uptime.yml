name: uptime
# Free watchdog: every 15 minutes, hit the Robinhood Chain verifier's /health.
# /health rolls up its own sensors (verifier identity, signer gas runway, gas
# coverage, settle-sweep freshness and errors, stale pots) into one status and
# answers 503 on red. Fails (and GitHub emails the repo owners) on red, on an
# unreachable verifier, or if the site is down. Yellow is logged, not failed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: verifier health
        run: |
          set -e
          out=$(curl -s --max-time 20 -w '\n%{http_code}' https://quarters-rh-mainnet.fly.dev/health) || { echo "verifier DOWN"; exit 1; }
          code=$(printf '%s' "$out" | tail -n1); body=$(printf '%s' "$out" | sed '$d')
          echo "$body"
          node -e '
            let d; try { d = JSON.parse(process.argv[1]); } catch (e) { console.log("health returned non-JSON"); process.exit(1); }
            const off = Object.entries(d.sensors || {}).filter(([, v]) => v.status !== "green").map(([k, v]) => k + "=" + v.status + " (" + v.detail + ")");
            console.log("status: " + d.status + (off.length ? " | " + off.join(" | ") : " | all sensors green"));
            if (d.status === "red" || d.ok === false) process.exit(1);
          ' "$body"
          [ "$code" = "200" ] || { echo "verifier HTTP $code"; exit 1; }
      - name: site up
        run: curl -sf --max-time 20 -o /dev/null https://quarters.fun/ || { echo "site DOWN"; exit 1; }
